# Scenario 3 - asynchronous batch completion.
# One batch of 10,000 requests across two models, with transient (10%) and permanent (2%)
# provider failures. The callback endpoint rejects the first two delivery attempts.
scenario: s3
description: >-
  One async batch of 10,000 requests across two models with transient and permanent failures;
  the callback receiver rejects the first two delivery attempts.
rate: 10000
duration_seconds: 1        # -> exactly one batch of 10,000
warmup_seconds: 0
models: {model-a: 0.5, model-b: 0.5}
batch_size: 10000
tokens: 1000
drain_timeout_seconds: 180
callback: true
callback_port: 9200
callback_fail_first_n: 2
verify_results: true
set_limits:
  model-a: {rpm: 30000, tpm: 60000000}
  model-b: {rpm: 20000, tpm: 40000000}
simulator:
  model-a: {transient_error_rate: 0.10, permanent_error_rate: 0.02, enforce_limits: true}
  model-b: {transient_error_rate: 0.10, permanent_error_rate: 0.02, enforce_limits: true}
checks: [accounting, limits_respected, batches]
